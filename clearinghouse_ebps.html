*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#EFEFEB;--sf:#FFFFFF;--sf2:#F0EDE8;--bd:#D6D6CE;--tx:#2D3033;--td:#767777;--ac:#213368;--gn:#2A5CAA;--gd:#E8EEF7;--yl:#F8A429;--yd:#FEF4E4;--bl:#009CDE;--bld:#E4F5FC;--pk:#800000;--pd:#F5E8E8;--pr:#58593F;--prd:#EEEEE8}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);line-height:1.5}
.app{max-width:1600px;margin:0 auto;padding:20px}
.hdr{padding:24px 0 16px;border-bottom:1px solid var(--bd);margin-bottom:20px}
.hdr h1{font-size:22px;font-weight:700;color:#213368;margin-bottom:4px}
.hdr .sub{font-size:13px;color:var(--td)}.hdr .src{font-size:11px;color:var(--td);margin-top:8px;font-style:italic}
.sbar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.sc{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:12px 16px;min-width:120px}
.sc .n{font-size:24px;font-weight:700;font-family:'JetBrains Mono',monospace}.sc .l{font-size:11px;color:var(--td);margin-top:2px}
.tabs{display:flex;gap:2px;margin-bottom:16px;background:var(--sf);border-radius:8px;padding:3px;width:fit-content}
.tab{padding:8px 16px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;color:var(--td);transition:all .2s;border:none;background:none}
.tab:hover{color:var(--tx)}.tab.active{background:#2A5CAA;color:#fff}
.flt{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.sb{background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:8px 12px;color:var(--tx);font-size:13px;width:280px;font-family:'DM Sans',sans-serif}
.sb:focus{outline:none;border-color:var(--ac)}
.fb{background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:6px 12px;color:var(--td);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}

.tc{overflow-x:auto;border-radius:8px;border:1px solid var(--bd)}

thead th:hover{color:#F8A429}
tbody tr{border-bottom:1px solid var(--bd);transition:background .1s;cursor:pointer}
tbody tr:hover{background:#ECEAE6}tbody td{padding:8px;vertical-align:top}

td.c{text-align:center}td.m{font-family:'JetBrains Mono',monospace;font-size:11px}

.oc{font-family:'JetBrains Mono',monospace;font-size:10px;min-width:100px;color:var(--td)}
.oe{font-family:'JetBrains Mono',monospace;font-size:11px;min-width:50px;text-align:right}
.dmc{margin-bottom:6px}.dml{font-size:11px;color:var(--td);display:flex;justify-content:space-between;margin-bottom:2px}
.dmb{height:12px;background:var(--sf2);border-radius:2px;overflow:hidden}.dmf{height:100%;border-radius:2px}
.ri{font-size:12px;color:var(--td);margin-bottom:8px}
.cd{background:var(--sf);border:1px solid var(--bd);border-radius:8px;margin-bottom:12px;overflow:hidden}
.cdh{padding:12px 16px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.cdh:hover{background:#ECEAE6}.cdt{font-size:14px;font-weight:600}
.cds{font-size:12px;color:var(--td);display:flex;gap:16px}.cds span{font-family:'JetBrains Mono',monospace}
.cr{display:flex;align-items:center;padding:8px 16px;border-bottom:1px solid var(--bd);font-size:12px;cursor:pointer;transition:background .1s}
.cr:hover{background:var(--sf2)}.cr:last-child{border-bottom:none}
.cn{width:260px;min-width:260px;font-weight:500}.crt{width:120px;min-width:120px}
.cb2{flex:1;display:flex;align-items:center;gap:8px}
.cm{flex:1;height:14px;background:var(--sf2);border-radius:2px;display:flex;overflow:hidden;max-width:300px}
.cm .gf{background:#2A5CAA}.cm .gn{background:#D6D6CE}.cm .gu{background:#800000}
.ce{font-family:'JetBrains Mono',monospace;font-size:11px;width:60px;text-align:right}

.cp{font-family:'JetBrains Mono',monospace;font-size:11px;width:50px;text-align:center;color:var(--td)}
.csb{display:flex;gap:20px;margin-bottom:20px;flex-wrap:wrap}
.csc{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:16px;flex:1;min-width:200px}
.csc h4{font-size:11px;color:var(--td);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.css2{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid var(--bd)}

}

function RCP(){
  const cats={"Child Safety":["Child safety: Child welfare administrative reports","Child safety: Self-reports of maltreatment","Child safety: Maltreatment risk assessment","Child safety: Medical indicators of maltreatment risk"],"Child Permanency":["Child permanency: Out-of-home placement","Child permanency: Least restrictive placement","Child permanency: Placement stability","Child permanency: Planned permanent exits"],"Child Well-Being":["Child well-being: Behavioral and emotional functioning","Child well-being: Social functioning","Child well-being: Cognitive functions and abilities","Child well-being: Physical development and health","Child well-being: Delinquent behavior","Child well-being: Substance use","Child well-being: Educational achievement and attainment"],"Adult Well-Being":["Adult well-being: Positive parenting practices","Adult well-being: Parent/caregiver mental or emotional health","Adult well-being: Parent/caregiver substance use","Adult well-being: Family functioning","Adult well-being: Parent/caregiver physical health","Adult well-being: Economic and housing stability","Adult well-being: Parent/caregiver criminal behavior"]};
  const dd={};
  for(const[cat,doms] of Object.entries(cats)){for(const dom of doms){
    const df=F.filter(f=>f.Outcome===dom);if(!df.length)continue;
    const pd=[];for(const f of df){const pi=NI[f["Program Name"]];if(pi===undefined)continue;const pr=P[pi];if(S.cr.length&&!S.cr.includes(pr.Rating))continue;const fv=f.Favorable||0,ne=f["No Effect"]||0,uf=f.Unfavorable||0;pd.push({i:pi,n:f["Program Name"],r:pr.Rating,es:f["Effect Size"],fv,ne,uf,t:fv+ne+uf,pl:pr["# State Plans"]||""})}
    if(!pd.length)continue;
    pd.sort((a,b)=>a.fv>0&&b.fv===0?-1:a.fv===0&&b.fv>0?1:(b.es||0)-(a.es||0));
    dd[dom]={cat,pd,tf:pd.reduce((s,p)=>s+p.fv,0),tn:pd.reduce((s,p)=>s+p.ne,0),tu:pd.reduce((s,p)=>s+p.uf,0),pf:pd.filter(p=>p.fv>0).length,tp:pd.length}
  }}
  const sD=Object.values(dd).filter(d=>d.cat==="Child Safety"),pD=Object.values(dd).filter(d=>d.cat==="Child Permanency");
  const sPF=new Set();sD.forEach(d=>d.pd.filter(p=>p.fv>0).forEach(p=>sPF.add(p.n)));
  const pPF=new Set();pD.forEach(d=>d.pd.filter(p=>p.fv>0).forEach(p=>pPF.add(p.n)));
  const cps=dd["Child safety: Child welfare administrative reports"];
  const ratings=["Well-Supported","Supported","Promising","Does Not Currently Meet Criteria"];
  const catList=["all","Child Safety","Child Permanency","Child Well-Being","Adult Well-Being"];

  let h="";
  h+=`<div class="cfb"><span class="fl">Rating:</span>`;
  ratings.forEach(r=>{h+=`<button class="fb${S.cr.includes(r)?" a":""}" data-action="tf" data-key="cr" data-value="${H(r)}">${r==="Does Not Currently Meet Criteria"?"Does Not Meet":r}</button>`});
  h+=`<span class="fl" style="margin-left:12px">Category:</span>`;
  catList.forEach(c=>{h+=`<button class="fb${S.cc===c?" a":""}" data-action="cc" data-value="${c}">${c==="all"?"All":c}</button>`});
  h+=`</div>`;

  for(const[cat,doms] of Object.entries(cats)){
    if(S.cc!=="all"&&S.cc!==cat)continue;
    for(const dom of doms){
      const d=dd[dom];if(!d)continue;
      const short=dom.split(": ")[1]||dom;
      const ex=S.cx[dom];
      h+=`<div class="cd"><div class="cdh" data-action="tx" data-value="${H(dom)}"><div class="cdt">${ex?"▼":"▶"} ${H(short)} <span style="font-size:11px;color:var(--td);font-weight:400">(${cat})</span></div><div class="cds"><span>${d.tp} programs</span><span style="color:var(--gn)">${d.pf} favorable</span><span>${d.tf}F/${d.tn}NE/${d.tu}U</span></div></div>`;
      if(ex){
        h+=`<div style="display:flex;padding:6px 16px;font-size:10px;color:var(--td);border-bottom:1px solid var(--bd)"><div style="width:260px">Program</div><div style="width:120px">Rating</div><div style="flex:1">Findings</div><div style="width:110px">Counts</div><div style="width:60px;text-align:right">ES</div><div style="width:50px;text-align:center">#Plans</div></div>`;
        d.pd.forEach(p=>{
          const t=p.t||1,fp=p.fv/t*100,np=p.ne/t*100,up=p.uf/t*100;
          const esS=p.es!=null?p.es.toFixed(2):"—";
          const esC=p.es>0.3?"var(--gn)":p.es>0.1?"var(--tx)":p.es<0?"var(--pk)":"var(--td)";
          h+=`<div class="cr" data-action="od" data-value="${p.i}"><div class="cn">${H(p.n)}</div><div class="crt">${RB(p.r)}</div><div class="cb2"><div class="cm"><div class="gf" style="width:${fp}%"></div><div class="gn" style="width:${np}%"></div><div class="gu" style="width:${up}%"></div></div></div><div class="cc">${p.fv}F/${p.ne}NE/${p.uf}U</div><div class="ce" style="color:${esC}">${esS}</div><div class="cp">${p.pl}</div></div>`
        })
      }
      h+=`</div>`
    }
  }
  return h
}

function render(){
  const fl=FP();
  const nr=P.filter(p=>p.Reviewed==="Yes").length;
  const np2=P.filter(p=>p["Planned for Review"]==="Yes").length;
  const nrc=P.filter(p=>p["Recommended for Review"]==="Yes").length;
  const nw=P.filter(p=>p.Rating==="Well-Supported").length;
  const nsp=P.filter(p=>p["# State Plans"]).length;
  const ofs=[["Favorable: CPS Reports/Maltreatment","CPS"],["Favorable: Out-of-Home Placement/Permanency","Placement"],["Favorable: Child Behavioral/Emotional","Child Beh."],["Favorable: Positive Parenting","Parenting"],["Favorable: Parent Mental Health","Parent MH"],["Favorable: Parent Substance Use","Parent SU"],["Favorable: Child Substance Use","Child SU"],["Favorable: Child Delinquency","Delinquency"],["Favorable: Family Functioning","Family"]];
  const sa=c=>S.sc===c?(S.sd==="asc"?" ↑":" ↓"):"";
  const ratings=["Well-Supported","Supported","Promising","Does Not Currently Meet Criteria"];

  let eh=`<div class="flt"><input class="sb" type="text" placeholder="Search programs..." id="searchbox"><div class="fg"><span class="fl">Rating:</span>`;
  ratings.forEach(r=>{eh+=`<button class="fb${S.rf.includes(r)?" a":""}" data-action="tf" data-key="rf" data-value="${H(r)}">${r==="Does Not Currently Meet Criteria"?"Does Not Meet":r}</button>`});
  eh+=`</div><div class="fg"><span class="fl">Status:</span>`;
  ["Reviewed","Planned","Recommended"].forEach(s=>{eh+=`<button class="fb${S.sf.includes(s)?" a":""}" data-action="tf" data-key="sf" data-value="${s}">${s}</button>`});
  eh+=`</div><div class="fg"><span class="fl">Favorable:</span><select id="ofsel" style="background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;color:var(--tx);font-size:12px;font-family:DM Sans,sans-serif"><option value="">All</option>`;
  ofs.forEach(([k,l])=>{eh+=`<option value="${k}"${S.of===k?" selected":""}>${l}</option>`});
  eh+=`</select></div>`;
  eh+=`<div class="fg"><span class="fl">Study Pop:</span>`;
  [["≥30% Black/African American","≥30% Black"],["≥30% Hispanic/Latino","≥30% Hispanic"],["≥30% White","≥30% White"],["≥10% American Indian/Alaska Native","≥10% AIAN"],["≥30% Asian/Pacific Islander","≥30% Asian/PI"]].forEach(([k,lab])=>{
    eh+=`<button class="fb${S.dp===k?' a':''}" data-action="dp" data-value="${k}">${lab}</button>`
  });
  eh+=`</div><div style="font-size:9px;color:var(--td);max-width:360px;line-height:1.3">Study sample thresholds from PSC-reported demographics. Does not indicate subgroup-specific effectiveness.</div>`;
  if(S.q||S.rf.length||S.sf.length||S.of||S.dp)eh+=`<button class="clr" data-action="cf">✕ Clear</button>`;
  eh+=`</div><div class="ri">${fl.length} of ${P.length} programs</div>`;
  eh+=`<div class="tc"><table><thead><tr><th onclick="TS('Program Name')" style="min-width:240px">Program${sa("Program Name")}</th><th>Status</th><th onclick="TS('Rating')">Rating${sa("Rating")}</th><th onclick="TS('# State Plans')" style="text-align:center">#Plans${sa("# State Plans")}</th><th onclick="TS('% Findings Favorable')" style="text-align:center">%Fav${sa("% Findings Favorable")}</th><th style="text-align:center">CPS</th><th style="text-align:center">Place</th><th style="text-align:center">Child</th><th style="text-align:center">Parent</th><th style="text-align:center">MH</th><th>Area</th><th onclick="TS('Age Min')" style="text-align:center">Ages${sa("Age Min")}</th></tr></thead><tbody>`;
  fl.slice(0,200).forEach(p=>{
    const idx=NI[p["Program Name"]];
    const ar=[];if(p["Mental Health"]==="X")ar.push("MH");if(p["Substance Use"]==="X")ar.push("SU");if(p["In-Home Parent Skill-Based"]==="X")ar.push("PS");if(p["Kinship Navigator"]==="X")ar.push("KN");
    const ages=p["Age Min"]!=null&&p["Age Max"]!=null?p["Age Min"]+"-"+p["Age Max"]:"";
    eh+=`<tr data-action="od" data-value="${idx}"><td class="nm">${p["Clearinghouse Page"]?`<a href="${p["Clearinghouse Page"]}" target="_blank" onclick="event.stopPropagation()">${H(p["Program Name"])}</a>`:H(p["Program Name"])}</td><td>${SD(p)}</td><td>${RB(p.Rating)}</td><td class="c m">${p["# State Plans"]||""}</td><td class="c m">${p["% Findings Favorable"]?p["% Findings Favorable"]+"%":""}</td><td class="c">${OF(p["Favorable: CPS Reports/Maltreatment"])}</td><td class="c">${OF(p["Favorable: Out-of-Home Placement/Permanency"])}</td><td class="c">${OF(p["Favorable: Child Behavioral/Emotional"])}</td><td class="c">${OF(p["Favorable: Positive Parenting"])}</td><td class="c">${OF(p["Favorable: Parent Mental Health"])}</td><td style="font-size:11px;color:var(--td)">${ar.join("·")}</td><td class="c m" style="font-size:11px">${ages}</td></tr>`
  });
  eh+=`</tbody></table>`;
  if(fl.length>200)eh+=`<div style="padding:12px;text-align:center;color:var(--td);font-size:12px">First 200 shown</div>`;
  eh+=`</div>`;

  document.getElementById("app").innerHTML=
    `<div class="hdr"><div style="font-size:11px;font-weight:600;color:#6B7280;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px">Chapin Hall</div><h1>Title IV-E Prevention Services — Program Database</h1><div class="sub">792 programs · evidence metrics · demographics · state adoption</div><div class="src">Sources: Clearinghouse (Feb 2026), Center for States (July 2023 + AZ/NV/PA), Children Now</div></div>`+
    `<div class="sbar"><div class="sc" style="background:#213368;border-color:#213368"><div class="n" style="color:#fff">${nr}</div><div class="l" style="color:#94A3C8">Reviewed</div></div><div class="sc"><div class="n" style="color:#58593F">${np2}</div><div class="l">Planned</div></div><div class="sc" style="background:#F8A429;border-color:#F8A429"><div class="n" style="color:#fff">${nrc}</div><div class="l" style="color:#FDE8C5">Recommended</div></div><div class="sc" style="background:#2A5CAA;border-color:#2A5CAA"><div class="n" style="color:#fff">${nw}</div><div class="l" style="color:#B8D4F0">Well-Supported</div></div><div class="sc"><div class="n" style="color:#800000">${nsp}</div><div class="l">In State Plans</div><div style="font-size:8px;color:var(--td);margin-top:2px">Est. Jul 2023</div></div></div>`+
    `<div class="tabs"><button class="tab${S.tab==="explorer"?" active":""}" data-action="tab" data-value="explorer">Program Explorer</button><button class="tab${S.tab==="outcomes"?" active":""}" data-action="tab" data-value="outcomes">Outcomes by Domain</button></div>`+
    (S.tab==="explorer"?eh:RCP())+
    (S.sel?RDTL(S.sel):"");

  const sb=document.getElementById("searchbox");
  if(sb){sb.value=S.q;sb.addEventListener("input",function(){S.q=this.value;render();setTimeout(()=>{const el=document.getElementById("searchbox");if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}},0)})}
  const sel=document.getElementById("ofsel");
  if(sel)sel.addEventListener("change",function(){S.of=this.value;render()})
}
render();

</script>
